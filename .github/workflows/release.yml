name: Release installable Moodle plugin ZIP

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'V ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="$(git log -1 --format=%s | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
          if [[ -z "$version" ]]; then
            echo "Expected a commit title such as V 1.1.4" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify version.php
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          grep -Fq "\$plugin->release = '$VERSION';" version.php

      - name: Create Moodle-installable ZIP
        shell: bash
        run: |
          git archive --format=zip --prefix=simplejournal/ --output=simplejournal.zip HEAD
          unzip -tqq simplejournal.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("simplejournal.zip") as archive:
              paths = [name for name in archive.namelist() if not name.endswith("/")]
              if not paths or {path.split("/", 1)[0] for path in paths} != {"simplejournal"}:
                  raise SystemExit("Archive root must be exactly simplejournal/")
              if "simplejournal/version.php" not in paths:
                  raise SystemExit("Missing version.php")
              if any(path.startswith("simplejournal/.github/") for path in paths):
                  raise SystemExit("Release archive contains CI files")
              print("Package verified:", len(paths), "files")
          PY

      - name: Publish release with ZIP asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: simplejournal.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
